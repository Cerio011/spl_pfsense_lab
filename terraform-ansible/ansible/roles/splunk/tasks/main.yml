---
# roles/splunk_forwarder/tasks/main.yml

- name: Baixar Splunk Universal Forwarder
  get_url:
    url: "https://download.splunk.com/products/universalforwarder/releases/10.4.1/linux/splunkforwarder-10.4.1-5a009d941268-linux-amd64.tgz"
    dest: /tmp/splunkforwarder.tgz

- name: Extrair Splunk Forwarder
  unarchive:
    src: /tmp/splunkforwarder.tgz
    dest: /opt
    remote_src: true
    creates: /opt/splunkforwarder

- name: Aceitar licenca e iniciar pela primeira vez (cria usuario admin)
  command: >
    /opt/splunkforwarder/bin/splunk start
    --accept-license --answer-yes --no-prompt
    --seed-passwd {{ splunk_admin_password }}
  args:
    creates: /opt/splunkforwarder/etc/.ui_login

- name: Configurar outputs.conf (destino - indexer AWS)
  template:
    src: outputs.conf.j2
    dest: /opt/splunkforwarder/etc/system/local/outputs.conf
  notify: restart splunkforwarder

- name: Configurar inputs.conf (fontes de log)
  template:
    src: inputs.conf.j2
    dest: /opt/splunkforwarder/etc/system/local/inputs.conf
  notify: restart splunkforwarder

- name: Habilitar Splunk Forwarder no boot
  command: /opt/splunkforwarder/bin/splunk enable boot-start
  args:
    creates: /etc/init.d/splunk

- name: Garantir que o servico esteja rodando
  service:
    name: splunk
    state: started
    enabled: true